[project]
name = "infer-bench"
version = "0.1.0"
description = "Load-test an OpenAI-compatible LLM server (vLLM, SGLang, NIM) and explain where the latency comes from"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "matplotlib>=3.8",
]

[project.scripts]
infer-bench = "infer_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infer_bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
